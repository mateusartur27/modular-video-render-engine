name: Render Video

# Este repositorio e publico e nao guarda credencial de nuvem.
#
# O control plane entrega URLs assinadas e de vida curta: uma para ler o
# manifesto, uma para enviar o MP4 pronto, e o proprio manifesto carrega URLs
# assinadas para narracao, musica e takes. Assim o job le e escreve o que precisa
# sem nenhum segredo de Cloudflare aqui.

# O nome da execucao carrega o jobId de proposito: `workflow_dispatch` responde
# HTTP 204 e nao devolve o id da execucao, entao esta e a unica forma de o control
# plane saber qual execucao e a dele. Com tres videos por lote, casar pela
# execucao mais recente seria uma corrida.
run-name: "render ${{ inputs.jobId }}"

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID do job de renderizacao emitido pelo control plane"
        required: true
        type: string
      videoId:
        description: "ID do video a renderizar"
        required: true
        type: string
      manifestUrl:
        description: "URL assinada e temporaria do RenderManifest@2"
        required: true
        type: string
      uploadUrl:
        description: "URL assinada e temporaria para enviar o MP4 ao R2"
        required: true
        type: string

jobs:
  render:
    name: Render MP4 with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stage job from signed manifest
        run: node scripts/stage-job.mjs --manifest-url "${{ inputs.manifestUrl }}"

      # O CRF vem do manifesto, nunca daqui.
      #
      # Sem ele o encoder usava o proprio padrao e o tamanho ficava a cargo da
      # imagem: em 2026-08-09 dois videos de praticamente a mesma duracao sairam
      # com 72,3 MB e 117,1 MB, e o segundo foi recusado no upload com HTTP 413,
      # porque um Cloudflare Worker aceita no maximo 100 MB de corpo.
      - name: Render
        run: |
          CRF=$(node -p "require('./public/manifest.json').output.crf")
          echo "Renderizando com crf=$CRF"
          npx remotion render src/index.ts Video "out/${{ inputs.videoId }}.mp4" --crf "$CRF" --log=error

      - name: Verify output against the manifest
        run: node scripts/verify-output.mjs --video "out/${{ inputs.videoId }}.mp4"

      - name: Upload MP4 to the signed url
        run: node scripts/upload-output.mjs --video "out/${{ inputs.videoId }}.mp4" --url "${{ inputs.uploadUrl }}"

      # Copia de conveniencia para inspecao humana. O artefato autoritativo e o
      # que foi enviado ao R2 no passo anterior; se aquele passo falhar, o job
      # falha, e este anexo nao mascara nada.
      - name: Keep a copy as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.videoId }}
          path: out/${{ inputs.videoId }}.mp4
          if-no-files-found: error
          retention-days: 7
